spring.application.name=WorkSphere-AI

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${WORKSPHERE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=WorkSphere;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${WORKSPHERE_DB_USERNAME}
spring.datasource.password=${WORKSPHERE_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

ai.api.key=${AI_API_KEY:}
